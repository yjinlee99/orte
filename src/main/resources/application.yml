spring:
  application:
    name: orte

  datasource:
    url: ${DB_URL:jdbc:h2:mem:orte}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000